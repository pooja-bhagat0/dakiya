<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <linearGradient id="bgGradAce" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="cabGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="containerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="120" height="90" rx="12" fill="url(#bgGradAce)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="60" cy="76" rx="50" ry="4" fill="#94A3B8" opacity="0.35"/>

  <!-- Back Dual Wheel -->
  <circle cx="34" cy="64" r="14" fill="#1E293B"/>
  <circle cx="34" cy="64" r="8" fill="#CBD5E1"/>
  <circle cx="34" cy="64" r="3.5" fill="#475569"/>

  <!-- Front Wheel -->
  <circle cx="92" cy="64" r="14" fill="#1E293B"/>
  <circle cx="92" cy="64" r="8" fill="#CBD5E1"/>
  <circle cx="92" cy="64" r="3.5" fill="#475569"/>

  <!-- Chassis / Frame -->
  <rect x="18" y="58" width="86" height="5" rx="1" fill="#0F172A"/>

  <!-- Cargo Container Box -->
  <rect x="16" y="24" width="58" height="34" rx="2" fill="url(#containerGrad)" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Container Details & Logo -->
  <line x1="28" y1="24" x2="28" y2="58" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="44" y1="24" x2="44" y2="58" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="60" y1="24" x2="60" y2="58" stroke="#CBD5E1" stroke-width="1.5"/>
  
  <!-- Delivery Express Brand Ribbon -->
  <rect x="22" y="36" width="46" height="10" rx="2" fill="#FF6B00"/>
  <text x="45" y="43.5" fill="#FFFFFF" font-size="6" font-weight="900" font-family="sans-serif" text-anchor="middle">EXPRESS 4W</text>

  <!-- Driver Cabin -->
  <path d="M74 28 L 92 32 Q 98 34 100 42 L 102 58 L 74 58 Z" fill="url(#cabGrad)"/>

  <!-- Windshield & Window -->
  <path d="M78 32 L 90 35 Q 94 38 95 44 L 78 44 Z" fill="#BAE6FD" opacity="0.8"/>
  <line x1="86" y1="34" x2="86" y2="44" stroke="#1E293B" stroke-width="1"/>

  <!-- Headlight & Bumper -->
  <rect x="98" y="52" width="5" height="5" rx="1" fill="#FACC15"/>
  <rect x="94" y="58" width="10" height="4" rx="1" fill="#1E293B"/>
</svg>
