<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <linearGradient id="bgGradToto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="bodyGradToto" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="120" height="90" rx="12" fill="url(#bgGradToto)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="60" cy="74" rx="46" ry="4" fill="#94A3B8" opacity="0.35"/>

  <!-- Back Wheels -->
  <circle cx="32" cy="62" r="14" fill="#1E293B"/>
  <circle cx="32" cy="62" r="9" fill="#E2E8F0"/>
  <circle cx="32" cy="62" r="4" fill="#D97706"/>

  <!-- Front Wheel -->
  <circle cx="92" cy="62" r="14" fill="#1E293B"/>
  <circle cx="92" cy="62" r="9" fill="#E2E8F0"/>
  <circle cx="92" cy="62" r="4" fill="#D97706"/>

  <!-- Rear Cargo Tray / E-Loader Body -->
  <rect x="18" y="44" width="46" height="18" rx="2" fill="url(#bodyGradToto)"/>
  <!-- Cargo Grid -->
  <line x1="28" y1="44" x2="28" y2="62" stroke="#B45309" stroke-width="1.5"/>
  <line x1="42" y1="44" x2="42" y2="62" stroke="#B45309" stroke-width="1.5"/>
  <line x1="54" y1="44" x2="54" y2="62" stroke="#B45309" stroke-width="1.5"/>

  <!-- Packages on Tray -->
  <rect x="22" y="32" width="16" height="12" rx="1" fill="#EA580C"/>
  <rect x="36" y="28" width="18" height="16" rx="1" fill="#CA8A04"/>
  <line x1="30" y1="32" x2="30" y2="44" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  <line x1="45" y1="28" x2="45" y2="44" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>

  <!-- Driver Cabin & Canopy -->
  <!-- Floorboard -->
  <path d="M64 60 L 88 60 L 86 52 L 64 52 Z" fill="#334155"/>
  <!-- Seat -->
  <rect x="66" y="44" width="12" height="8" rx="2" fill="#0F172A"/>

  <!-- Cabin Pillars -->
  <line x1="62" y1="44" x2="62" y2="24" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="84" y1="44" x2="80" y2="24" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Canopy Roof -->
  <path d="M58 24 Q 72 20 86 24 L 84 27 Q 72 23 58 27 Z" fill="url(#roofGrad)"/>

  <!-- Windshield -->
  <path d="M80 27 L 85 46 L 78 46 L 74 27 Z" fill="#38BDF8" opacity="0.4"/>

  <!-- Front Nose & Headlamp -->
  <path d="M86 46 L 94 54 L 88 60 Z" fill="url(#bodyGradToto)"/>
  <circle cx="94" cy="52" r="3" fill="#FDE047"/>

  <!-- Handlebars -->
  <line x1="82" y1="46" x2="78" y2="42" stroke="#0F172A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
