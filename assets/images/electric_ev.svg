<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <linearGradient id="bgGradEV" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="bodyGradEV" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="120" height="90" rx="12" fill="url(#bgGradEV)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="60" cy="74" rx="44" ry="4" fill="#94A3B8" opacity="0.35"/>

  <!-- Back Wheel -->
  <circle cx="34" cy="60" r="14" fill="#1E293B"/>
  <circle cx="34" cy="60" r="9" fill="#E2E8F0"/>
  <circle cx="34" cy="60" r="4" fill="#10B981"/>

  <!-- Front Wheel -->
  <circle cx="86" cy="60" r="14" fill="#1E293B"/>
  <circle cx="86" cy="60" r="9" fill="#E2E8F0"/>
  <circle cx="86" cy="60" r="4" fill="#10B981"/>

  <!-- Floorboard -->
  <path d="M44 60 L 68 60 L 66 54 L 42 54 Z" fill="#334155"/>

  <!-- EV Battery Pack Indicator -->
  <rect x="46" y="55" width="16" height="4" rx="1" fill="#10B981"/>
  <path d="M54 53 L 52 57 L 55 57 L 53 61" stroke="#FACC15" stroke-width="1" stroke-linecap="round"/>

  <!-- Rear Body -->
