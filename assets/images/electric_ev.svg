  <!-- Green EV Badge / Electric Lightning Icon -->
  <circle cx="102" cy="18" r="9" fill="#10B981"/>
  <path d="M102 12 L 99 18 L 102 18 L 101 24 L 105 17 L 102 17 Z" fill="#FFFFFF"/>
