<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" width="120" height="90">
  <defs>
    <linearGradient id="bgGradBicycle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="frameGradBicycle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>
  <rect width="120" height="90" rx="12" fill="url(#bgGradBicycle)"/>
  
  <!-- Ground Shadow -->
  <ellipse cx="60" cy="74" rx="42" ry="4" fill="#94A3B8" opacity="0.35"/>

  <!-- Left Wheel (Back) -->
  <circle cx="34" cy="58" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="34" cy="58" r="13" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="34" cy="58" r="3" fill="#0284C7"/>

  <!-- Right Wheel (Front) -->
  <circle cx="86" cy="58" r="16" fill="none" stroke="#334155" stroke-width="3"/>
  <circle cx="86" cy="58" r="13" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="86" cy="58" r="3" fill="#0284C7"/>

  <!-- Frame Structure -->
  <!-- Bottom Bracket -->
  <circle cx="56" cy="58" r="3.5" fill="#0F172A"/>
  
  <!-- Rear Stays -->
  <line x1="34" y1="58" x2="52" y2="38" stroke="url(#frameGradBicycle)" stroke-width="3" stroke-linecap="round"/>
  <line x1="34" y1="58" x2="56" y2="58" stroke="url(#frameGradBicycle)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Seat Tube -->
  <line x1="56" y1="58" x2="52" y2="34" stroke="url(#frameGradBicycle)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Saddle / Seat -->
  <path d="M44 32 C 48 30, 56 30, 60 33 C 58 35, 48 35, 44 32 Z" fill="#0F172A"/>
  
  <!-- Down Tube -->
  <line x1="56" y1="58" x2="78" y2="38" stroke="url(#frameGradBicycle)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Top Tube -->
  <line x1="52" y1="38" x2="78" y2="38" stroke="url(#frameGradBicycle)" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Fork & Stem -->
  <line x1="86" y1="58" x2="78" y2="34" stroke="url(#frameGradBicycle)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Handlebars -->
  <path d="M74 30 L 79 33 L 84 31" fill="none" stroke="#0F172A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Delivery Bag / Basket on Rear -->
  <rect x="36" y="34" width="14" height="12" rx="2" fill="#FF6B00"/>
  <path d="M40 34 L 40 46 M 46 34 L 46 46" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
  <rect x="39" y="38" width="8" height="4" rx="1" fill="#FFFFFF"/>
</svg>
